name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  IMAGE: quay.io/project-lightpath/tssc-cli-tools

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Validate release tag
        id: release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The image-tag contract supports plain vMAJOR.MINOR.PATCH releases.
          # Validate before any image build or publication can run.
          version_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "${RELEASE_TAG}" =~ ${version_pattern} ]]; then
            printf 'Unsupported release tag %q; use vMAJOR.MINOR.PATCH.\n' "${RELEASE_TAG}" >&2
            exit 1
          fi
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - run: go test ./... -race -coverprofile=coverage.out

      - uses: golangci/golangci-lint-action@v8

      # The chart ships with the release, so a broken template should fail
      # the same quality gate as broken Go code.
      - uses: azure/setup-helm@v4
      - run: helm lint chart/tssc-tasks

  image:
    runs-on: ubuntu-latest
    needs: [preflight, build]
    steps:
      - uses: actions/checkout@v5

      # Build on PRs too: the Containerfile is part of the contract, and a
      # broken one should not be discovered at release time. Both targets:
      # the default micro image, and the tools variant the Tekton build and
      # SBOM steps run (its syft stage is the one most likely to break).
      - name: Build image
        run: |
          podman build \
            --build-arg TSSC_VERSION="$(git describe --tags --always --dirty)" \
            --build-arg COMMIT="$(git rev-parse --short HEAD)" \
            -t tssc-cli-tools:ci -f Containerfile .

      - name: Build tools image
        run: |
          podman build --target tools \
            --build-arg TSSC_VERSION="$(git describe --tags --always --dirty)" \
            --build-arg COMMIT="$(git rev-parse --short HEAD)" \
            -t tssc-cli-tools:tools-ci -f Containerfile .

      - name: Smoke test
        run: |
          podman run --rm tssc-cli-tools:ci --version
          podman run --rm tssc-cli-tools:tools-ci --version
          podman run --rm --entrypoint /usr/bin/syft tssc-cli-tools:tools-ci version

  # Publishing is a job of this workflow rather than a separate one so it can
  # depend on the quality gate directly. A standalone workflow would either
  # duplicate the gate -- free to drift out of step with it -- or chain off
  # workflow_run, which runs against the default branch's definition and is
  # easy to get subtly wrong.
  publish:
    runs-on: ubuntu-latest
    needs: [preflight, build, image]
    # Never on a pull request. Secrets are not exposed to fork PRs anyway, and
    # code that has not been merged must not be able to push a release tag.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v5
        with:
          # git describe needs the full history and tags; the default shallow
          # fetch would silently degrade every version stamp to a bare hash.
          fetch-depth: 0

      - name: Check registry credentials are configured
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: |
          if [ -z "$QUAY_USERNAME" ] || [ -z "$QUAY_TOKEN" ]; then
            echo "QUAY_USERNAME and QUAY_TOKEN must be set as organization secrets." >&2
            echo "Without them podman login fails with an opaque error." >&2
            exit 1
          fi

      - name: Compute tags
        id: meta
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          # Each workflow attempt gets a unique tag. A rerun or a separate
          # release-tag event for this commit must not replace an earlier
          # build whose digest may differ (for example, due to mutable bases).
          build_tag="sha-${sha}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tags="${build_tag}"
          if [[ -n "${RELEASE_TAG}" ]]; then
            tags="${tags} ${RELEASE_TAG}"
          fi
          {
            echo "sha=${sha}"
            echo "build_tag=${build_tag}"
            echo "version=$(git describe --tags --always)"
            echo "tags=${tags}"
          } >> "$GITHUB_OUTPUT"

      - name: Build multi-arch images
        env:
          TSSC_VERSION: ${{ steps.meta.outputs.version }}
          SHA: ${{ steps.meta.outputs.sha }}
          BUILD_TAG: ${{ steps.meta.outputs.build_tag }}
        run: |
          set -euo pipefail
          # Both architectures cross-compile from the native builder; see the
          # --platform=$BUILDPLATFORM note in the Containerfile. The tools
          # variant's syft comes from the anonymous registry.access.redhat.com,
          # so the only registry credential needed is the Quay push secret.
          common_args=(
            --platform linux/amd64,linux/arm64
            --build-arg TSSC_VERSION="${TSSC_VERSION}"
            --build-arg COMMIT="${SHA}"
            --build-arg DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            -f Containerfile .
          )
          podman build --manifest "${IMAGE}:${BUILD_TAG}" "${common_args[@]}"
          podman build --manifest "${IMAGE}:tools-${BUILD_TAG}" --target tools \
            "${common_args[@]}"

      - name: Log in to Quay
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: echo "$QUAY_TOKEN" | podman login quay.io -u "$QUAY_USERNAME" --password-stdin

      - name: Push
        env:
          BUILD_TAG: ${{ steps.meta.outputs.build_tag }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            echo "pushing ${IMAGE}:${tag}"
            # --all pushes every architecture in the manifest list, not just
            # the one matching the runner.
            podman manifest push --all \
              --digestfile /tmp/digest \
              "${IMAGE}:${BUILD_TAG}" "docker://${IMAGE}:${tag}"
            echo "pushing ${IMAGE}:tools-${tag}"
            podman manifest push --all \
              --digestfile /tmp/tools-digest \
              "${IMAGE}:tools-${BUILD_TAG}" "docker://${IMAGE}:tools-${tag}"
          done
          {
            echo "### Published \`${IMAGE}\`"
            echo
            echo "| variant | digest | tags |"
            echo "|---|---|---|"
            echo "| default (logic only) | \`$(cat /tmp/digest)\` | ${TAGS// /, } |"
            echo "| tools (buildah + syft) | \`$(cat /tmp/tools-digest)\` | ${TAGS// /, } with \`tools-\` prefix |"
            echo
            echo "Pin by digest in a Tekton Task:"
            echo '```'
            echo "# logic-only steps:"
            echo "image: ${IMAGE}@$(cat /tmp/digest)"
            echo "# build and SBOM steps (what the tssc-tasks chart pins):"
            echo "image: ${IMAGE}@$(cat /tmp/tools-digest)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Helm chart
        # The chart is versioned in lockstep with the image: it is published
        # on release tags only, and only when Chart.yaml already carries the
        # version being released. Bump version and appVersion in Chart.yaml
        # as part of the release.
        if: needs.preflight.outputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: |
          set -euo pipefail
          chart_version="${RELEASE_TAG#v}"
          declared="$(sed -n 's/^version:[[:space:]]*//p' chart/tssc-tasks/Chart.yaml)"
          declared_app="$(sed -n 's/^appVersion:[[:space:]]*//p' chart/tssc-tasks/Chart.yaml | tr -d '"')"
          if [[ "${declared}" != "${chart_version}" || "${declared_app}" != "${chart_version}" ]]; then
            echo "Chart.yaml says version=${declared} appVersion=${declared_app}," >&2
            echo "but the release tag is ${RELEASE_TAG}. Bump both to ${chart_version} before tagging." >&2
            exit 1
          fi

          echo "$QUAY_TOKEN" | helm registry login quay.io -u "$QUAY_USERNAME" --password-stdin
          chart_out="$(helm package chart/tssc-tasks)"
          # helm push prints the ref with its digest; capture it for the
          # summary so consumers can pin the chart, not just the image.
          push_output="$(helm push "${chart_out}" oci://quay.io/project-lightpath)"
          echo "${push_output}"
          chart_ref="$(echo "${push_output}" | grep -o 'sha256:[0-9a-f]*')"
          {
            echo "### Published chart \`quay.io/project-lightpath/tssc-tasks\`"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| version | ${chart_version} |"
            echo "| digest | \`${chart_ref}\` |"
            echo
            echo "Consume pinned by version:"
            echo '```'
            echo "helm pull oci://quay.io/project-lightpath/tssc-tasks --version ${chart_version}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          helm registry logout quay.io

      - name: Log out
        if: always()
        run: podman logout quay.io || true

  promote-latest:
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Serialize only the moving latest pointer. Per-run sha tags and release
    # tags are published independently by the publish job above.
    concurrency:
      group: promote-latest-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Check run is newest main commit
        id: freshness
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          newest_main="$(git rev-parse FETCH_HEAD)"
          if [[ "${GITHUB_SHA}" != "${newest_main}" ]]; then
            echo "Run ${GITHUB_SHA} is stale; main is now ${newest_main}. Skipping latest promotion."
            echo "promote=false" >> "$GITHUB_OUTPUT"
          else
            echo "promote=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Promote latest
        if: steps.freshness.outputs.promote == 'true'
        env:
          SOURCE_TAG: sha-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${SOURCE_TAG}"
          docker buildx imagetools create \
            --tag "${IMAGE}:tools-latest" \
            "${IMAGE}:tools-${SOURCE_TAG}"
          echo "Promoted ${IMAGE}:${SOURCE_TAG} to ${IMAGE}:latest (and its tools variant to tools-latest)" >> "$GITHUB_STEP_SUMMARY"

      - name: Log out
        if: always()
        run: docker logout quay.io || true
